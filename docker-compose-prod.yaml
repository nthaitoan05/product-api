name: product-api

services:
  mongodb:
    image: mongo:8.0
    container_name: nammongodb
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand({ ping: 1 })"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    image: ${PRODUCT_API_IMAGE:-thaitoan005/product-api:latest}
    container_name: product-api
    env_file:
      - .env
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:' + process.env.PORT + '/health',
          { signal: AbortSignal.timeout(3000) })
          .then(res => process.exit(res.status === 200 ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  mongodb_data:
    external: true
    name: ${MONGO_DATA_VOLUME:?MONGO_DATA_VOLUME must be set}